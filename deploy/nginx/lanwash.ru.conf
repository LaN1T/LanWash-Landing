# Конфиг сайта lanwash.ru для nginx: /etc/nginx/sites-available/lanwash.
# HTTPS снаружи принимает Caddy (порт 443, /opt/lanwash-caddy-test) и передаёт запросы сюда, на 127.0.0.1:8081.
# Как применить и проверить — README, раздел «nginx». На сервере сначала сравните с текущим файлом:
# строки «managed by Certbot» берите оттуда, если пути к сертификатам другие.
#
# Что здесь по сравнению с прежним конфигом:
#   - заголовки безопасности (HSTS, CSP, nosniff, Referrer-Policy, Permissions-Policy);
#   - кэш: /assets/ — год и immutable, документы и index.html — no-cache;
#   - страницы ошибок 404/50x для статики;
#   - gzip для текстовой статики.
# Прокси /v1/ и /pay/ на 127.0.0.1:8080 не меняется: он целиком в snippets/lanwash-api.conf, и ни один
# заголовок, кроме HSTS, к этим адресам не добавляется (карты ниже возвращают для них пустую строку,
# а пустой add_header nginx не отправляет).

# ---- Карты: http-контекст, файл подключается из http { } через sites-enabled. ----

# Статика сайта или прокси API.
map $uri $lanwash_site {
    default        1;
    ~^/(v1|pay)/   0;
}

# Кэш. Файлы в /assets/ сборка называет по хешу содержимого — их можно кэшировать навсегда.
# HTML, theme.js, legal.js и legal.css имён с хешем не имеют — браузер каждый раз сверяет ETag (304).
map $uri $lanwash_cache_control {
    default                              "";
    ~^/(v1|pay)/                         "";
    /                                    "no-cache";
    ~\.html$                             "no-cache";
    ~^/assets/                           "public, max-age=31536000, immutable";
    ~^/fonts/                            "public, max-age=604800";
    ~^/images/                           "public, max-age=86400";
    ~^/favicon\.(ico|png)$               "public, max-age=86400";
    ~^/(theme|legal)\.(js|css)$          "no-cache";
}

# Адреса Яндекс Метрики — официальный список для CSP:
# https://yandex.ru/support/metrica/code/install-counter-csp.html
# mc.webvisor.com, mc.webvisor.org и wss:// из того же списка нужны только Вебвизору — он выключен
# (src/analytics.ts), поэтому их здесь нет. Включите Вебвизор — добавьте их в connect-src и frame-src.
map $lanwash_site $lanwash_metrika_hosts {
    default "https://mc.yandex.ru https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz";
}

# Интерфейс Метрики показывает карту кликов, открывая сайт во фрейме, — эти домены должны быть
# в frame-ancestors (тот же документ Яндекса). Без карты кликов здесь достаточно 'self'.
map $lanwash_site $lanwash_metrika_ancestors {
    default "https://metrika.yandex.ru https://metrika.yandex.by https://metrika.yandex.com https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz https://metrika.yandex https://metrika.ya.ru https://metrica.yandex.ru https://metrica.yandex.by https://metrica.yandex.com https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex https://metrica.ya.ru https://analytics.yandex.ru https://analytics.yandex.by https://analytics.yandex.com https://analytics.yandex.com.tr https://analytics.yandex.kz https://metr.yandex.ru https://metr.yandex.by https://metr.yandex.com https://metr.yandex.com.tr https://metr.yandex.kz";
}

# CSP сайта. Inline-скриптов и inline-стилей на страницах нет (тема — theme.js, стили — файлами),
# поэтому 'unsafe-inline' не нужен ни для script-src, ни для style-src.
#   script-src  — сборка + tag.js Метрики (mc.yandex.ru) и её модули (yastatic.net);
#   img-src     — blob: для превью фото в анкете, пиксели Метрики;
#   connect-src — API анкеты (https://lanwash.ru, в том числе когда сайт открыт как www.lanwash.ru)
#                 и отправка данных Метрики;
#   frame-src   — служебный фрейм синхронизации Метрики.
# 404/50x — отдельная строгая политика: их единственный inline-скрипт (<base> для GitHub Pages)
# разрешён по sha256. Изменили скрипт в public/404.html или 50x.html — пересчитайте хеш (README).
map $uri $lanwash_csp {
    default        "default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net; style-src 'self'; img-src 'self' blob: $lanwash_metrika_hosts; font-src 'self'; connect-src 'self' https://lanwash.ru $lanwash_metrika_hosts; frame-src $lanwash_metrika_hosts; frame-ancestors 'self' $lanwash_metrika_ancestors; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
    ~^/(v1|pay)/   "";
    /404.html      "default-src 'self'; script-src 'self' 'sha256-Eeqcfo0wzvfYXvR/PbmQ4+77YGBQADR/3orYvuNotYc='; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
    /50x.html      "default-src 'self'; script-src 'self' 'sha256-Eeqcfo0wzvfYXvR/PbmQ4+77YGBQADR/3orYvuNotYc='; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
}

map $lanwash_site $lanwash_nosniff {
    1       "nosniff";
    default "";
}

map $lanwash_site $lanwash_referrer_policy {
    1       "strict-origin-when-cross-origin";
    default "";
}

# Сайту не нужны ни камера, ни геопозиция, ни платежи в браузере: фото в анкете выбираются через
# <input type="file">, копирование пароля — clipboard-write, он не ограничен.
map $lanwash_site $lanwash_permissions_policy {
    1       "accelerometer=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
    default "";
}

# ---- HTTP → HTTPS. Certbot обычно пишет этот блок сам; по смыслу он такой. ----
server {
    listen 80;
    listen [::]:80;
    server_name lanwash.ru www.lanwash.ru;
    return 301 https://$host$request_uri;
}

server {
    # Порт 443 занят Caddy; nginx слушает только локальный адрес за ним. HTTP/2 к посетителю отдаёт Caddy.
    listen 127.0.0.1:8081 ssl;
    server_name lanwash.ru www.lanwash.ru;

    ssl_certificate /etc/letsencrypt/live/lanwash.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lanwash.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Релизы лежат в /var/www/lanwash/releases, current — symlink на действующий.
    root /var/www/lanwash/current;
    index index.html;
    server_tokens off;

    # API и оплата: /v1/ и /pay/ → 127.0.0.1:8080. Без изменений.
    include snippets/lanwash-api.conf;

    # Заголовки — только на уровне server и только через карты выше. Если добавить add_header внутрь
    # location, nginx перестанет наследовать эти строки в нём — тогда повторите их там.
    # HSTS: год, только для lanwash.ru и www. includeSubDomains — когда все поддомены (app. и др.)
    # точно работают по HTTPS; preload — ещё позже, его трудно отменить.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $lanwash_csp always;
    add_header X-Content-Type-Options $lanwash_nosniff always;
    add_header Referrer-Policy $lanwash_referrer_policy always;
    add_header Permissions-Policy $lanwash_permissions_policy always;
    add_header Cache-Control $lanwash_cache_control always;

    # Сжатие статики. application/json не сжимается: ответы API несут токены и данные пользователя,
    # а сжатие таких ответов открывает атаки по длине (BREACH).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain font/woff2;

    location / {
        # $uri/index.html, а не $uri/: каталог без index.html дал бы 403 вместо страницы 404.
        try_files $uri $uri/index.html =404;
        # Страницы ошибок — только для статики: ответы /v1/ и /pay/ (в том числе 502 при упавшем
        # бэкенде) остаются такими, какие есть, без HTML вместо JSON.
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }

    location = /404.html {
        internal;
    }
    location = /50x.html {
        internal;
    }

    # Скрытые файлы (.git, .env и т. п.) не отдаём; .well-known нужен certbot.
    location ~ /\.(?!well-known/) {
        return 404;
    }
}

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2364e4" />
    <title>Страница не найдена — LanWash</title>
    <script>
      // Страницу ошибки сервер отдаёт по любому адресу. <base> ведёт ссылки и стили к корню сайта,
      // в том числе когда сайт открыт из подпапки (GitHub Pages).
      ;(function () {
        var base = document.createElement('base')
        var prefixes = ['/LanWash-Site/', '/LanWash-Landing/']
        base.href = '/'
        for (var i = 0; i < prefixes.length; i++)
          if (location.pathname.indexOf(prefixes[i]) === 0) base.href = prefixes[i]
        document.head.appendChild(base)
      })()
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="legal.css" />
    <style>
      .error-main {
        min-height: calc(100dvh - 72px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .legal-main .error-code {
        font-size: clamp(64px, 18vw, 120px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -4px;
        color: var(--blue);
        margin: 0 0 16px;
      }
      .error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 28px 0 8px;
      }
      .error-actions a,
      .error-actions button {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .error-actions .primary {
        background: var(--blue);
        color: #fff;
      }
      .error-actions .quiet {
        background: #eef2f6;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <header class="legal-header">
      <div class="inner">
        <a class="legal-brand" href="./"
          ><img src="images/logo-white.png" alt="" width="34" height="34" />LanWash</a
        >
      </div>
    </header>
    <main class="legal-main error-main">
      <p class="error-code">404</p>
      <h1>Такой страницы нет</h1>
      <p class="legal-meta">Возможно, в адресе опечатка или страница переехала.</p>
      <div class="error-actions">
        <a class="primary" href="./">На главную</a>
        <a class="quiet" href="./?audience=business">LanWash для бизнеса</a>
      </div>
      <footer class="legal-footer">
        <span>© 2026 LanWash</span>
        <a href="terms.html">Пользовательское соглашение</a>
        <a href="privacy.html">Политика конфиденциальности</a>
        <span>Поддержка: <a href="mailto:support@lanwash.ru">support@lanwash.ru</a></span>
      </footer>
    </main>
  </body>
</html>

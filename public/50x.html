<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2364e4" />
    <title>Сервис временно недоступен — LanWash</title>
    <!-- Единственный inline-скрипт сайта: в CSP страниц ошибок он разрешён по sha256
         (deploy/nginx/lanwash.ru.conf). Меняете текст скрипта — пересчитайте хеш, см. README. -->
    <script>
      // Страницу ошибки сервер отдаёт по любому адресу. <base> ведёт ссылки и стили к корню сайта,
      // в том числе когда сайт открыт из подпапки (GitHub Pages).
      ;(function () {
        var base = document.createElement('base')
        var prefixes = ['/LanWash-Site/', '/LanWash-Landing/']
        base.href = '/'
        for (var i = 0; i < prefixes.length; i++)
          if (location.pathname.indexOf(prefixes[i]) === 0) base.href = prefixes[i]
        document.head.appendChild(base)
      })()
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="legal.css?v=20261114-1" />
    <script src="legal.js?v=20261114-1"></script>
  </head>
  <body>
    <header class="legal-header">
      <div class="inner">
        <a class="legal-brand" href="./"
          ><img src="images/logo-white.png" alt="" width="34" height="34" />LanWash</a
        >
      </div>
    </header>
    <main class="legal-main error-main">
      <p class="error-code">Ошибка</p>
      <h1>Сервис временно недоступен</h1>
      <p class="legal-meta">
        Попробуйте обновить страницу через несколько минут. Если ошибка повторяется, напишите на
        support@lanwash.ru.
      </p>
      <div class="error-actions">
        <!-- Обработчик — в legal.js: inline onclick заблокировал бы CSP. -->
        <button class="primary" type="button" data-reload>Обновить страницу</button>
        <a class="quiet" href="./">На главную</a>
      </div>
      <footer class="legal-footer">
        <span>© 2026 LanWash</span>
        <a href="terms.html">Пользовательское соглашение</a>
        <a href="privacy.html">Политика конфиденциальности</a>
        <span>Поддержка: <a href="mailto:support@lanwash.ru">support@lanwash.ru</a></span>
      </footer>
    </main>
  </body>
</html>

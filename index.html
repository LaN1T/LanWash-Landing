<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2364e4" />
    <script>
      ;(() => {
        const saved = localStorage.getItem('lanwash.theme')
        const dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta
      name="description"
      content="LanWash — мойки рядом, удобная запись и бонусы за каждый визит. Зарегистрируйтесь в Android-приложении LanWash."
    />
    <meta property="og:title" content="LanWash — чистая машина. Выгода рядом." />
    <meta
      property="og:description"
      content="Выбирайте мойку, планируйте визиты и пользуйтесь бонусами. Всё в одном приложении."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/manrope.ttf" as="font" type="font/ttf" crossorigin />
    <title>LanWash — чистая машина. Выгода рядом.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
